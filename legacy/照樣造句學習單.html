<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>照樣造句學習單（低年級）</title>
<style>
:root{
  --bpmf:'BpmfZihiKaiStd','字嗨注音標楷','Bpmf Zihi Kai Std','BpmfZihiKaiStd-Regular','DFKai-SB','標楷體',serif;
  --ui:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#e9e7e2;font-family:var(--ui);color:#222;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ===== 控制面板 ===== */
.panel{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ccc;
  padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:15px}
.panel h1{font-size:18px;margin:0}
.panel label{cursor:pointer;margin-right:6px}
.panel .dis{color:#aaa;cursor:default}
.panel select,.panel button{font-size:15px;padding:5px 12px}
.panel button{background:#2f5d50;color:#fff;border:0;border-radius:6px;cursor:pointer}
.panel button.gray{background:#888}
#fontStatus,#warn{font-size:13px;padding:3px 10px;border-radius:12px}
.ok{background:#dff0d8;color:#2d6a2d}.ng{background:#f8e0e0;color:#a33}

/* ===== A4 頁面 ===== */
#sheets{padding:24px 0}
.page{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;overflow:hidden;
  padding:10mm 12mm 8mm;box-shadow:0 2px 10px rgba(0,0,0,.15);
  display:flex;flex-direction:column;font-family:var(--bpmf)}
.head{display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:.5mm solid #222;padding-bottom:1.5mm;font-size:4.2mm}
.title{font-size:7.5mm;margin:2.5mm 0 0;display:flex;align-items:baseline;gap:4mm}
.title small{font-size:4.4mm;color:#444}
.sec{margin-top:3mm}
.sec-t{font-size:5.2mm;font-weight:bold;margin-bottom:1.5mm;display:flex;align-items:center;gap:2mm;line-height:1.5}
.sec-t .q{font-weight:normal;margin-left:2mm}
.num{display:inline-flex;width:6.5mm;height:6.5mm;border-radius:50%;border:.4mm solid #222;
  align-items:center;justify-content:center;font-family:var(--ui);font-size:3.8mm;flex:none}
.story{display:flex;gap:4mm;align-items:stretch}
.story .txt{flex:1;font-size:6.2mm;line-height:1.95;border:.35mm dashed #999;border-radius:3mm;padding:2mm 4mm}
.ill{width:72mm;flex:none}
.ill svg{width:72mm;height:49.5mm;display:block;border:.35mm solid #444;border-radius:2mm}
.task{font-size:5mm;margin-top:1.5mm;line-height:1.8}
.subq{font-size:4.2mm;margin:-1mm 0 1.5mm;color:#333}

/* 範例句 */
.ex{display:flex;gap:2mm;align-items:flex-start;margin-bottom:2mm}
.ex .lab{font-size:4.4mm;padding:1mm 2mm;background:#eee;border-radius:2mm;margin-top:.8mm}
.blk .w{font-size:6.2mm;border:.4mm solid #222;border-radius:2mm;padding:.5mm 3mm;min-width:11mm;text-align:center}
.blk .tag{font-size:3.8mm;text-align:center;color:#444;margin-top:.5mm}

/* 書寫格：20mm 以上 */
.grid{display:grid;width:max-content;border-top:.45mm solid #333;border-left:.45mm solid #333}
.cell{height:20.5mm;border-right:.45mm solid #333;border-bottom:.45mm solid #333;display:flex;position:relative}
.cell .sq{width:20mm;height:100%;position:relative}
.m-hz .cell .sq::before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:.25mm dashed #bbb}
.m-hz .cell .sq::after{content:'';position:absolute;top:50%;left:0;right:0;border-top:.25mm dashed #bbb}
.cell .zy{flex:1;border-left:.3mm solid #888}
.cell.given{background:#f1f1f1}
.cell .gch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12mm;color:#555;line-height:1}

/* 頁尾 */
.foot{margin-top:auto;display:grid;grid-template-columns:1fr 1.3fr;gap:4mm;
  border-top:.3mm dashed #999;padding-top:2mm}
.check{font-size:4.4mm;line-height:1.75}
.check .items{display:grid;grid-template-columns:1fr 1fr}
.box{display:inline-block;width:4.2mm;height:4.2mm;border:.35mm solid #222;margin-right:1.2mm;vertical-align:-.4mm}
.adult{border:.35mm solid #222;border-radius:2mm;padding:1mm 3mm 1.5mm;font-family:var(--ui);font-size:3.6mm}
.adult .ln{border-bottom:.25mm solid #999;height:7mm;display:flex;align-items:flex-end;padding-bottom:.5mm}

/* 著色線稿模式 */
.lineart .ill [fill]:not([fill="none"]):not(.k){fill:#fff}
.lineart .ill .f{stroke:#fff}

/* 引導頁 */
.guide{font-family:var(--ui);font-size:4mm;line-height:1.85;display:block}
.guide h2{font-size:6mm;margin:2mm 0 3mm}
.guide h3{font-size:4.6mm;margin:4mm 0 1mm}
.guide p{margin:0 0 2mm}
.guide .src{font-size:3.2mm;color:#666;margin-top:6mm}

/* 先想一想 構思框 */
.plan{display:flex;gap:2mm;margin-bottom:2.5mm}
.pl{flex:1;border:.35mm solid #222;border-radius:2mm;overflow:hidden}
.pt{font-size:4.2mm;text-align:center;background:#eee;border-bottom:.3mm solid #222;padding:.5mm}
.pb{height:16mm}
.plan-t{font-size:4.4mm;margin-bottom:1mm}
.ex{flex-wrap:wrap}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .panel{display:none}
  #sheets{padding:0}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
}
</style>
</head>
<body>

<div class="panel">
  <h1>照樣造句學習單</h1>
  <span>年級：
    <label><input type="radio" name="lv" value="1" checked> 一年級 完整句</label>
    <label><input type="radio" name="lv" value="2"> 二年級 四要素句</label>
    <label><input type="radio" name="lv" value="3"> 三年級 說清楚說生動</label>
  </span>
  <span>題數：<select id="count"><option>3</option><option>4</option><option selected>5</option></select></span>
  <span>書寫格：
    <label><input type="radio" name="mode" value="hz" checked> 國字格</label>
    <label><input type="radio" name="mode" value="zy"> 注音格</label>
    <label id="zyWrap"><input type="checkbox" id="zy" checked> 國字格旁附注音欄</label>
  </span>
  <span>插圖：
    <label><input type="radio" name="art" value="color" checked> 彩色</label>
    <label><input type="radio" name="art" value="line"> 著色線稿</label>
  </span>
  <label><input type="checkbox" id="withGuide" checked> 附引導頁</label>
  <button class="gray" id="reshuffle">重新抽題</button>
  <button id="printBtn">列印</button>
  <span id="fontStatus">偵測字型中…</span>
  <span id="warn"></span>
</div>

<div id="sheets"></div>

<script>

   複製回來覆蓋引號 '...' 內的文字，以 UTF-8 存檔。
   ans＝照樣寫預估字數　lifeEst＝寫我的生活預估字數（皆含標點）

const LEVELS = {

    stories: [
      { title:'星期六的早餐', pattern:'誰＋做什麼', svg:'breakfast',
        text:['星期六早上，子晴起床。','媽媽在廚房煎蛋。','子晴喝牛奶。','爸爸看報紙。','小貓在桌下吃魚。'],

  }

  g+=`<path d="M-4.5 -76.5Q0 -72.5 4.5 -76.5" stroke="#222" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;

  g+=p.hat;

}

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
const q=s=>document.querySelector(s);
// 拆字：IVS 讀音選擇器（U+E0100–E01EF）併入前一字
function splitChars(s){ const out=[]; for(const ch of s){ const cp=ch.codePointAt(0);
  if(cp>=0xE0100 && cp<=0xE01EF && out.length) out[out.length-1]+=ch; else out.push(ch);} return out; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function gridHTML(total,opt,given=''){
  const withZy = opt.mode==='hz' && opt.zy;
  const per = withZy ? 6 : 9, w = withZy ? 27.5 : 20.5;
  const inner = opt.mode==='hz' ? `<div class="sq"></div>${withZy?'<div class="zy"></div>':''}` : '';
  const g = splitChars(given);
  let h = g.map(c=>`<div class="cell given"><span class="gch">${c}</span></div>`).join('');
  for(let i=g.length;i<total;i++) h+=`<div class="cell">${inner}</div>`;
  return `<div class="grid ${opt.mode==='hz'?'m-hz':'m-zy'}" style="grid-template-columns:repeat(${per},${w}mm)">${h}</div>`;
}
const perRow = opt => (opt.mode==='hz' && opt.zy) ? 6 : 9;

/* ---------- 單題頁 ---------- */
const headHTML=(L,idx,total)=>`<div class="head"><span>姓名：＿＿＿＿＿＿　日期：＿＿月＿＿日</span><span>${L.name}　第 ${idx}／${total} 題</span></div>`;
const exHTML=s=>`<div class="ex"><span class="lab">範例</span>${s.example.map(([w,t])=>`<div class="blk"><div class="w">${w}</div><div class="tag">${t||'&nbsp;'}</div></div>`).join('')}</div>`;
const planHTML=labels=>!labels?'':`<div class="plan-t">先想一想（寫關鍵詞或注音就好）：</div><div class="plan">${labels.map(l=>`<div class="pl"><div class="pt">${l}</div><div class="pb"></div></div>`).join('')}</div>`;
const footHTML=L=>`<div class="foot">
  <div class="check"><b>我會檢查</b><div class="items">${L.checklist.map(c=>`<div><span class="box"></span>${c}</div>`).join('')}</div></div>
  <div class="adult"><b>大人的話</b><div class="ln">我欣賞你：</div><div class="ln">再試試看：</div></div></div>`;

function pageHTML(s,idx,total,L,opt){
  const per=perRow(opt);
  const fillTotal=Math.ceil((splitChars(s.fill.given).length+s.fill.ans+3)/per)*per;
  const lifeTotal=Math.max(2,Math.ceil((s.lifeEst+4)/per))*per;
  const title=`<div class="title">${s.title}<small>句型：${s.pattern}</small></div>`;
  const sec1=`<div class="sec"><div class="sec-t"><span class="num">1</span>讀一讀，找一找</div>
    <div class="story"><div class="txt">${s.text.join('')}</div><div class="ill">${SVGS[s.svg]}</div></div>
    <div class="task">${s.find}</div></div>`;
  const sec2=`<div class="sec"><div class="sec-t"><span class="num">2</span>照樣寫<span class="q">${s.fill.hint}</span></div>
    ${exHTML(s)}${gridHTML(fillTotal,opt,s.fill.given)}</div>`;
  const sec3=`<div class="sec"><div class="sec-t"><span class="num">3</span>寫我的生活<span class="q">${s.life}</span></div>
    <div class="subq">${s.subq||`用「${s.pattern}」，寫一句真的發生的事。`}</div>
    ${planHTML(s.plan||L.plan)}${gridHTML(lifeTotal,opt)}</div>`;
  const h=headHTML(L,idx,total);
  if(!L.twoPage) return `<section class="page">${h}${title}${sec1}${sec2}${sec3}${footHTML(L)}</section>`;
  return `<section class="page">${h}${title}${sec1}${sec2}</section>
          <section class="page">${h}${title}${sec3}${footHTML(L)}</section>`;
}

/* ---------- 引導頁 ---------- */
function guideHTML(L){
  return `<section class="page guide">
    <h2>家長／老師引導小抄：${L.guide.title}</h2>
    ${L.guide.items.map(([h,p])=>`<h3>${h}</h3><p>${p}</p>`).join('')}
    <div class="src">教學概念整理自：宜蘭縣教師部落格〈[寫作教學]造句怎麼寫啊？〉https://2blog.ilc.edu.tw/1003/2019/03/24/</div>
  </section>`;
}

/* ---------- 產生 ---------- */
let order=[];
function getOpt(){ return { lv:q('input[name=lv]:checked').value, n:+$('count').value,
  mode:q('input[name=mode]:checked').value, zy:$('zy').checked,
  art:q('input[name=art]:checked').value, guide:$('withGuide').checked }; }
function build(reshuffle){
  const opt=getOpt(), L=LEVELS[opt.lv];
  if(reshuffle || !order.length) order=shuffle(L.stories);
  const picked=order.slice(0,opt.n);
  let html=picked.map((s,i)=>pageHTML(s,i+1,opt.n,L,opt)).join('');
  if(opt.guide) html+=guideHTML(L);
  const box=$('sheets'); box.innerHTML=html;
  box.classList.toggle('lineart', opt.art==='line');
  $('zyWrap').style.opacity = opt.mode==='hz' ? 1 : .4;
  $('zy').disabled = opt.mode!=='hz';
  requestAnimationFrame(checkOverflow);
}
function checkOverflow(){
  const bad=[...document.querySelectorAll('.page:not(.guide)')]
    .map((p,i)=>p.scrollHeight>p.clientHeight+2 ? i+1 : 0).filter(Boolean);
  const w=$('warn');
  if(bad.length){ w.textContent=`第 ${bad.join('、')}  頁超出 A4`; w.className='ng'; }
  else { w.textContent='版面：每題一頁 OK'; w.className='ok'; }
}
function detectFont(){
  const c=document.createElement('canvas').getContext('2d');
  const stack=getComputedStyle(document.documentElement).getPropertyValue('--bpmf');
  c.font=`100px 'DFKai-SB','標楷體',serif`; const w0=c.measureText('我').width;
  c.font=`100px ${stack}`; const w1=c.measureText('我').width;
  const el=$('fontStatus');
  if(Math.abs(w1-w0)>3){ el.textContent='注音字型：已偵測到'; el.className='ok'; }
  else { el.textContent='注音字型：未偵測到，請先安裝字嗨注音標楷'; el.className='ng'; }
}

/* ---------- 事件 ---------- */
$('count').onchange=()=>build(false);
$('withGuide').onchange=()=>build(false);
$('zy').onchange=()=>build(false);
document.querySelectorAll('input[name=mode],input[name=art]').forEach(r=>r.onchange=()=>build(false));
document.querySelectorAll('input[name=lv]').forEach(r=>r.onchange=()=>build(true));
$('reshuffle').onclick=()=>build(true);
$('printBtn').onclick=()=>window.print();

build(true);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{ detectFont(); checkOverflow(); });
</script>
